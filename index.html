<!DOCTYPE html>
<html>
<head>
<title>Анонимный тест на мотивацию</title>
<style>
body {
  font-family: sans-serif;
  margin: 20px;
}
.question {
  margin-bottom: 15px;
}
button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  cursor: pointer;
}
#results {
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>Тест на мотивацию</h1>

<div id="quiz">
  <div class="question">
    <p>1. Вам нравится ставить перед собой сложные цели?</p>
    <label><input type="radio" name="q1" value="1"> Да</label>
    <label><input type="radio" name="q1" value="0"> Нет</label>
  </div>

  <div class="question">
    <p>2. Вы легко отвлекаетесь от работы?</p>
    <label><input type="radio" name="q2" value="0"> Да</label>
    <label><input type="radio" name="q2" value="1"> Нет</label>
  </div>

  <div class="question">
    <p>3. Вы часто откладываете дела на потом?</p>
    <label><input type="radio" name="q3" value="0"> Да</label>
    <label><input type="radio" name="q3" value="1"> Нет</label>
  </div>

  <div class="question">
    <p>4. Вы быстро теряете интерес к начатому?</p>
    <label><input type="radio" name="q4" value="0"> Да</label>
    <label><input type="radio" name="q4" value="1"> Нет</label>
  </div>

  <div class="question">
    <p>5. Вы считаете себя целеустремленным человеком?</p>
    <label><input type="radio" name="q5" value="1"> Да</label>
    <label><input type="radio" name="q5" value="0"> Нет</label>
  </div>
</div>

<button onclick="showResults()">Узнать результат</button>

<div id="results"></div>

<script>
function showResults() {
  let score = 0;
  for (let i = 1; i <= 5; i++) {
    let radios = document.getElementsByName('q' + i);
    for (let j = 0; j < radios.length; j++) {
      if (radios[j].checked) {
        score += parseInt(radios[j].value);
        break;
      }
    }
  }

  let resultText = "";
  if (score >= 4) {
    resultText = "У вас высокая мотивация! Вы целеустремленный и энергичный человек.";
  } else if (score >= 2) {
    resultText = "У вас средняя мотивация. Есть потенциал, но нужно поработать над собой.";
  } else {
    resultText = "У вас низкая мотивация. Возможно, вам стоит пересмотреть свои цели и ценности.";
  }

  document.getElementById("results").innerHTML = resultText;
}
</script>

</body>
</html>
